<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" fill="none">
  <defs>
    <!-- Drop Shadow for 3D realism -->
    <filter id="espatodo-3d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" floodColor="#000000" floodOpacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#0284C7" floodOpacity="0.3" />
    </filter>

    <!-- Outer Blue Ribbon Face: Brushed Cyan to Royal Blue -->
    <linearGradient id="outer-blue-face" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="65%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Outer Ribbon Bevel Depth -->
    <linearGradient id="outer-blue-depth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Inner Nested Ribbon Face -->
    <linearGradient id="inner-blue-face" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Central 45° Diagonal Shaft: Blue -> Purple -> Coral Transition -->
    <linearGradient id="shaft-face" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="65%" stop-color="#9333EA" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Shaft Extruded 3D Side Face -->
    <linearGradient id="shaft-depth" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="70%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Arrow Head Upper Light Facet -->
    <linearGradient id="arrow-upper-facet" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="30%" stop-color="#F97316" />
      <stop offset="70%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <!-- Arrow Head Lower Dark Facet -->
    <linearGradient id="arrow-lower-facet" x1="30%" y1="80%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="40%" stop-color="#9A3412" />
      <stop offset="80%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Lower Loop: Blue base rising into glowing Orange Hook -->
    <linearGradient id="lower-loop-outer" x1="10%" y1="40%" x2="90%" y2="60%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="90%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Lower Loop Inner Surface -->
    <linearGradient id="hook-orange-face" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <!-- Text 3D Gradients -->
    <linearGradient id="text-blue-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="text-orange-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="30%" stop-color="#FB923C" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 20) scale(1.0)" filter="url(#espatodo-3d-shadow)">
    <!-- 1. Outer Blue Ribbon -->
    <path
      d="M 180 320 C 160 250, 190 140, 290 85 C 330 65, 380 70, 410 95 L 420 105 C 375 80, 325 85, 280 110 C 200 160, 180 255, 195 325 Z"
      fill="url(#outer-blue-depth)"
    />
    <path
      d="M 182 324 C 165 240, 200 135, 305 82 C 345 62, 395 72, 420 100 L 375 140 C 350 120, 320 115, 290 130 C 220 168, 205 245, 218 318 Z"
      fill="url(#outer-blue-face)"
    />
    <path
      d="M 182 324 C 165 240, 200 135, 305 82 C 345 62, 395 72, 420 100"
      stroke="#7DD3FC"
      stroke-width="3"
      stroke-linecap="round"
      stroke-opacity="0.9"
      fill="none"
    />

    <!-- 2. Inner Nested Ribbon -->
    <path
      d="M 230 310 C 225 245, 255 170, 325 135 C 355 120, 385 125, 405 145 L 375 175 C 360 160, 340 155, 320 168 C 270 195, 250 255, 255 310 Z"
      fill="url(#outer-blue-depth)"
      opacity="0.8"
    />
    <path
      d="M 235 305 C 230 240, 260 170, 330 135 C 360 120, 390 125, 410 148 L 380 178 C 365 165, 345 160, 325 172 C 275 200, 258 255, 262 305 Z"
      fill="url(#inner-blue-face)"
    />
    <path
      d="M 235 305 C 230 240, 260 170, 330 135 C 360 120, 390 125, 410 148"
      stroke="#BAE6FD"
      stroke-width="2"
      stroke-linecap="round"
      stroke-opacity="0.85"
      fill="none"
    />

    <!-- 3. Central Diagonal Shaft -->
    <path
      d="M 250 435 L 435 250 L 452 267 L 267 452 Z"
      fill="url(#shaft-depth)"
    />
    <path
      d="M 232 417 L 417 232 L 442 257 L 257 442 Z"
      fill="url(#shaft-face)"
    />
    <line
      x1="244"
      y1="430"
      x2="430"
      y2="244"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-opacity="0.6"
    />

    <!-- 4. Arrow Head -->
    <path
      d="M 390 270 L 495 110 L 435 145 Z"
      fill="#5C1D06"
      opacity="0.8"
    />
    <path
      d="M 495 110 L 375 190 L 420 235 Z"
      fill="url(#arrow-upper-facet)"
    />
    <path
      d="M 495 110 L 420 235 L 470 285 Z"
      fill="url(#arrow-lower-facet)"
    />
    <line
      x1="420"
      y1="235"
      x2="495"
      y2="110"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-opacity="0.9"
    />
    <line
      x1="375"
      y1="190"
      x2="495"
      y2="110"
      stroke="#FED7AA"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />

    <!-- 5. Lower Loop & Hook -->
    <path
      d="M 220 405 C 190 445, 205 505, 255 538 C 305 570, 375 565, 425 530 C 475 495, 495 440, 498 375 L 478 375 C 475 425, 455 470, 415 498 C 375 525, 318 528, 275 500 C 235 472, 222 432, 240 405 Z"
      fill="#0B1120"
      opacity="0.75"
    />
    <path
      d="M 235 410 C 205 450, 220 505, 268 535 C 315 565, 385 560, 432 525 C 478 490, 492 440, 495 380 L 460 380 C 458 425, 442 462, 408 488 C 372 515, 320 518, 282 492 C 248 468, 238 435, 252 410 Z"
      fill="url(#lower-loop-outer)"
    />
    <path
      d="M 495 380 C 495 345, 485 305, 465 270 L 435 300 C 448 325, 458 355, 460 380 Z"
      fill="url(#hook-orange-face)"
    />
    <path
      d="M 465 270 L 435 300 L 452 285 Z"
      fill="#FED7AA"
      opacity="0.95"
    />
    <path
      d="M 268 535 C 315 565, 385 560, 432 525"
      stroke="#38BDF8"
      stroke-width="2.5"
      stroke-opacity="0.7"
      fill="none"
    />
  </g>

  <!-- 3D Wordmark "espatodo.com" -->
  <g transform="translate(600, 750)">
    <!-- 3D Bevel Extrusion Underlayer -->
    <text
      x="0"
      y="8"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="-2px"
    >
      <tspan fill="#0B132B">espatodo</tspan>
      <tspan fill="#431407">.com</tspan>
    </text>

    <!-- Front Metallic Face -->
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="-2px"
    >
      <tspan fill="url(#text-blue-face)">espatodo</tspan>
      <tspan fill="url(#text-orange-face)">.com</tspan>
    </text>

    <!-- Specular Highlight Line -->
    <text
      x="0"
      y="-2"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="-2px"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.5"
      stroke-opacity="0.4"
    >
      <tspan>espatodo</tspan>
      <tspan>.com</tspan>
    </text>
  </g>
</svg>
